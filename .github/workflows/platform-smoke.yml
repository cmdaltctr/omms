name: Platform Package Smoke

# Full install, test, and pack smoke across every platform users run on.
# Runs before each release (called from release.yml), weekly to catch runner
# image and upstream drift, and on demand. Kept off pull requests so the
# macOS jobs do not queue behind the 5-job macOS concurrency limit.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to test (the Release workflow passes the release commit)
        type: string
        required: false
        default: ''
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-smoke:
    name: ${{ matrix.os }} / package smoke
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon: macos-15 (floor) / macos-26 (darwin/arm64).
        # Intel: macos-15-intel / macos-26-intel (darwin/x64).
        os:
          - macos-15
          - macos-26
          - macos-15-intel
          - macos-26-intel
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Empty for scheduled and manual runs, which test the triggering commit.
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install source dependencies
        run: bun install --frozen-lockfile

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Validate source
        run: bun run ci:local

      - name: Pack and install published package shape
        shell: bash
        run: |
          set -euo pipefail

          pack_dir="$RUNNER_TEMP/omms-pack"
          smoke_dir="$RUNNER_TEMP/omms-smoke"
          mkdir -p "$pack_dir" "$smoke_dir"

          npm pack --pack-destination "$pack_dir"
          tarball_path=$(find "$pack_dir" -name "*.tgz" -print -quit)
          test -n "$tarball_path"

          cd "$smoke_dir"
          npm init -y
          override_version=$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { resolve } from "node:path";
            const pkg = JSON.parse(readFileSync(resolve(process.env.GITHUB_WORKSPACE, "package.json"), "utf8"));
            process.stdout.write(pkg.overrides?.["onnxruntime-node"] ?? "");
          ')
          if [ -n "$override_version" ]; then
            npm pkg set "overrides.onnxruntime-node=$override_version"
          fi
          npm install --ignore-scripts "$tarball_path"
          cp "$GITHUB_WORKSPACE/scripts/native-deps-smoke.mjs" ./native-deps-smoke.mjs
          cp "$GITHUB_WORKSPACE/scripts/verify-libsql-vector.mjs" ./verify-libsql-vector.mjs
          cp "$GITHUB_WORKSPACE/scripts/smoke-test.mjs" ./smoke-test.mjs
          node ./native-deps-smoke.mjs
          node ./verify-libsql-vector.mjs
          node ./smoke-test.mjs
