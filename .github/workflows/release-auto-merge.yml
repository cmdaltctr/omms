name: Release auto-merge

# Merges the release pull request after its Quality run passes, Windows
# included. The merge uses the release GitHub App token: a merge made with
# GITHUB_TOKEN would not start the Release workflow. npm still holds the
# version until the maintainer approves it with 2FA (see docs/ci.md).
on:
  workflow_run:
    workflows: [Quality]
    types: [completed]

concurrency:
  group: release-auto-merge-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  merge:
    name: merge
    if: >-
      vars.RELEASE_PLEASE_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # --match-head-commit refuses the merge if release-please pushed a newer
      # commit after this Quality run started; that commit gets its own run.
      - name: Merge the release pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh pr merge "$HEAD_BRANCH" --repo "$GITHUB_REPOSITORY" --merge \
            --match-head-commit "$HEAD_SHA"
