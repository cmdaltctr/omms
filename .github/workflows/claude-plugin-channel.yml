name: Claude plugin channel

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true # This job pushes the stable branch.
      - name: Sync stable to npm latest
        run: bash scripts/sync-claude-plugin-channel.sh
