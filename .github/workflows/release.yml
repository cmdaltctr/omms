name: Release

# release-please keeps a release pull request open on main. Merging it tags
# vX.Y.Z and creates the GitHub Release in this same run; the six-platform
# smoke gate then runs and the version is staged on npm for the maintainer to
# approve. Publishing happens here rather than on a tag-push workflow because
# tags created by release-please do not trigger other workflows.
on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    # Switched on by the repository variable RELEASE_PLEASE_ENABLED once the
    # release GitHub App and npm setup exist (see docs/ci.md).
    if: ${{ vars.RELEASE_PLEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      # The tagged commit. It can be older than this run's push when the
      # release is created on a later run, so build and publish exactly it.
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # A GitHub App token (not GITHUB_TOKEN) so release pull requests trigger
      # the required Quality checks and can be merged.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          # client-id replaces the deprecated app-id input. GitHub accepts the App ID here too.
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Full platform matrix must pass before anything is staged on npm.
  smoke:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/platform-smoke.yml
    with:
      ref: ${{ needs.release-please.outputs.sha }}
    permissions:
      contents: read

  publish:
    name: publish
    needs: [release-please, smoke]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # The npm trusted publisher for this workflow is registered with this
    # environment and set to stage-only (see docs/ci.md).
    environment: npm-publish
    outputs:
      staged: ${{ steps.stage.outputs.staged }}
    permissions:
      contents: write # annotate the GitHub Release
      id-token: write # npm trusted publishing (OIDC)
      pull-requests: write # tell the maintainer to approve
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false # never cache in release builds
          registry-url: 'https://registry.npmjs.org'

      # Staged publishing needs npm 11.15.0 or later.
      - name: Update npm
        run: npm install -g npm@^11.15.0

      - name: Install source dependencies
        run: bun install --frozen-lockfile

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Verify package contents
        run: bun run verify:package

      - name: Check version matches the release
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "package.json version $PACKAGE_VERSION does not match release $RELEASE_VERSION"
            exit 1
          fi

      # No token: npm authenticates through OIDC. The version is held in npm's
      # Staged tab until the maintainer approves it with 2FA.
      - name: Stage on npm
        id: stage
        run: |
          set -o pipefail
          npm stage publish --access public 2>&1 | tee stage.log
          echo "staged=true" >> "$GITHUB_OUTPUT"
          # npm prints "+ om-memory-system@X.Y.Z (staged with id <uuid>)".
          stage_id=$(grep -Eo 'staged with id [0-9a-f-]{36}' stage.log | tail -1 | cut -d' ' -f4 || true)
          echo "stage_id=$stage_id" >> "$GITHUB_OUTPUT"

      - name: Add approval note to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          STAGE_ID: ${{ steps.stage.outputs.stage_id || '<stage-id>' }}
        run: |
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          {
            echo
            echo "---"
            echo
            echo "**npm:** \`om-memory-system@$RELEASE_VERSION\` is staged and not yet installable."
            echo "Approve it with \`bun run release:approve\`, or run \`npm stage approve $STAGE_ID\` (2FA)."
            echo "To try it first: \`npm stage download $STAGE_ID\` and install the tarball."
          } >> notes.md
          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

      # A comment that mentions the owner sends a GitHub notification (email
      # when the owner turns it on). It goes on the merged release pull request,
      # so no issue is opened.
      - name: Tell the maintainer to approve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          STAGE_ID: ${{ steps.stage.outputs.stage_id }}
          OWNER: ${{ github.repository_owner }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/pulls" --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "No release pull request found for $RELEASE_SHA; the GitHub Release note has the steps."
            exit 0
          fi
          {
            echo "@$OWNER \`om-memory-system@$RELEASE_VERSION\` passed the six-platform smoke and is staged on npm."
            echo
            echo "Approve it with 2FA from the main checkout: \`bun run release:approve\`"
            echo
            echo "Stage ID: \`${STAGE_ID:-not found; run npm stage list om-memory-system}\`"
          } > comment.md
          gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file comment.md

  # Smoke or publish failed before npm staged the version, but the tag and
  # GitHub Release exist. Mark the release and tell the maintainer. The failed
  # run also sends GitHub's own failed-workflow notification.
  report-failure:
    name: report-failure
    needs: [release-please, smoke, publish]
    if: >-
      always() &&
      needs.release-please.outputs.release_created == 'true' &&
      needs.publish.outputs.staged != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # annotate the GitHub Release
      pull-requests: write # tell the maintainer
    steps:
      - name: Mark the GitHub Release and tell the maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          SMOKE: ${{ needs.smoke.result }}
          PUBLISH: ${{ needs.publish.result }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          {
            echo
            echo "---"
            echo
            echo "**npm:** \`om-memory-system@$RELEASE_VERSION\` was not published to npm. The release run failed: $RUN_URL"
          } >> notes.md
          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/pulls" --jq '.[0].number // empty')
          [ -n "$pr" ] || exit 0
          {
            echo "@$OWNER The Release run for \`$TAG_NAME\` failed (smoke: $SMOKE, publish: $PUBLISH). npm did not stage the version."
            echo
            echo "Read the failed job: $RUN_URL"
            echo "Fix it with a \`fix:\` commit; release-please then proposes the next patch release."
          } > comment.md
          gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file comment.md
