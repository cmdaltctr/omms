name: Embedding Backend Verification

# Runs automatically when a pull request touches native dependencies, the
# embedding service, or this workflow. Also runs on demand. Covers Apple
# Silicon (macos-latest), Intel (macos-15-intel), Windows, and Linux, because
# onnxruntime-node and sharp ship a separate native binary per platform. The
# onnxruntime-node@1.20.1 pin stays regardless (#225: newer releases can
# SIGILL on macOS process exit).
on:
  pull_request:
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - '.npmrc'
      - 'src/services/embedding.ts'
      - 'src/services/onnxruntime-resolve.ts'
      - 'scripts/verify-embedding-backend.mjs'
      - 'scripts/verify-nested-onnxruntime-fixture.mjs'
      - '.github/workflows/embedding-backend.yml'
  workflow_dispatch:

concurrency:
  group: embedding-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / embedding backend
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - macos-15-intel
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # Mimic OpenCode's plugin install, which does not run lifecycle scripts.
      - name: Install without lifecycle scripts
        run: bun install --ignore-scripts

      - name: Assert native binaries present without postinstall
        shell: bash
        run: |
          set -e
          echo "Checking prebuilt sharp (@img) ..."
          ls node_modules/@img/sharp-*/lib/*.node
          echo "Checking onnxruntime-node native binding ..."
          found=$(find node_modules/onnxruntime-node/bin -name '*.node' | head -1)
          test -n "$found" && echo "onnxruntime binding: $found"

      # Run real feature extraction under both supported host runtimes.
      - name: Embedding smoke (Bun)
        run: bun scripts/verify-embedding-backend.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Embedding smoke (Node)
        run: node scripts/verify-embedding-backend.mjs

  # Targeted #210 / #225 regression: OpenCode-shaped nested install on Intel,
  # using the reporter's Bun/Node versions. The compiled host must run real
  # inference and exit 0 (no Ort::Env SIGILL).
  nested-intel-regression:
    name: macos-15-intel / nested OpenCode fixture
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install source dependencies
        run: bun install --frozen-lockfile

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Nested fixture + compiled host inference/exit (Bun 1.3.14)
        run: bun scripts/verify-nested-onnxruntime-fixture.mjs

      - name: Nested fixture + embedding (Node 22)
        # Node cannot Bun --compile; the compiled-host check is Bun-only above.
        run: node scripts/verify-nested-onnxruntime-fixture.mjs
        env:
          SKIP_COMPILE_HOST: '1'
