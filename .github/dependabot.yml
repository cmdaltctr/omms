version: 2

updates:
  - package-ecosystem: "bun"
    directories:
      - "/"
      - "/web"
    # Conventional prefix so release-please lists dependency updates and
    # releases them as patches.
    commit-message:
      prefix: "deps"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Keep this pin until onnxruntime ships a darwin/x64 build after the
      # macOS Ort::Env teardown fix (#27961 / #24579) and OpenCode embeds Bun >1.3.14.
      - dependency-name: "onnxruntime-node"
      # ESLint 10 / typescript-eslint do not support TypeScript 7 yet (peer: <6.1.0).
      - dependency-name: "typescript"
        versions: [">=7"]
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "ci"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
